<div class="ai ai-build">
  <div class="app">
    <section class="main">
      <div class="controls">
        <div class="control">
          <span class="label">Book</span>
          <nav class="seg" id="books" aria-label="Choose a book"></nav>
        </div>
        <div class="control">
          <span class="label">Remembers the last</span>
          <div class="seg" id="memory" role="group" aria-label="Remembers the last">
            <button data-n="1">1 word</button><button data-n="2">2 words</button
            ><button data-n="3">3 words</button>
          </div>
        </div>
        <div class="control speed">
          <label for="speed">Speed</label>
          <input type="range" id="speed" min="1" max="14" step="1" value="4" />
        </div>
        <div class="actions">
          <button id="clear" class="icon" title="Clear: start again" aria-label="Clear"></button>
          <button id="next" class="icon" title="Next word" aria-label="Next"></button>
          <button id="go" class="play" title="Start">Start</button>
        </div>
      </div>

      <div class="stage" id="stage">
        <div class="output" id="text" aria-live="polite"></div>
        <textarea id="pasteText" placeholder="Paste text here…" spellcheck="false"></textarea>
      </div>
      <div class="status" id="status"></div>
      <div class="finished" id="finished" hidden>
        <span>Finished learning.</span>
        <button id="predict">Predict</button>
      </div>
    </section>

    <aside class="panel">
      <section class="widget">
        <div class="widget-head">
          <h2>Memory</h2>
          <button class="link" id="punct">Show punctuation</button>
        </div>
        <div class="memory-rows" id="memoryRows"></div>
      </section>
      <section class="widget">
        <h2>Learning</h2>
        <div class="log" id="log"><div class="track" id="track"></div></div>
      </section>
      <div class="tally" id="tally"></div>
      <div class="progress" aria-hidden="true"><div class="fill" id="progressFill"></div></div>
    </aside>
  </div>
</div>
