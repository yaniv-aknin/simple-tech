<div class="ai">
  <div class="app">
    <nav class="books" id="books" aria-label="Choose a book"></nav>

    <section class="main">
      <div class="controls">
        <div class="control memory">
          <span class="label" id="memLabel">Remembers the last 2 words</span>
          <input type="range" id="memory" min="1" max="3" step="1" value="2" aria-labelledby="memLabel" />
          <div class="ticks"><span>1 word</span><span>2 words</span><span>3 words</span></div>
        </div>
        <div class="control speed">
          <label for="speed">Speed</label>
          <input type="range" id="speed" min="1" max="14" step="1" value="8" />
          <div class="ticks"><span>slow</span><span>fast</span></div>
        </div>
        <div class="control seed">
          <label for="seed">Start with</label>
          <input
            type="text"
            id="seed"
            placeholder="e.g. the detective"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <div class="actions">
          <button id="clear">Clear</button>
          <button id="next">Next</button>
          <button id="go">Start</button>
        </div>
      </div>

      <div class="stage" id="stage">
        <div class="output" id="output" aria-live="polite"></div>
        <textarea id="pasteText" placeholder="Paste text here…" spellcheck="false"></textarea>
      </div>
      <div class="legend" id="legend">
        <span class="swatch">highlighted</span> = copied word for word from the book
      </div>
      <div class="status" id="status"></div>
    </section>

    <aside class="panel">
      <h2>Potential next words</h2>
      <div class="bars" id="bars"></div>
    </aside>
  </div>
</div>
