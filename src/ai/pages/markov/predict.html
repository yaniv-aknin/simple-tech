<div class="ai">
  <div class="app">
    <section class="main">
      <div class="controls">
        <div class="control">
          <span class="label">Book</span>
          <nav class="seg" id="books" aria-label="Choose a book"></nav>
        </div>
        <div class="control">
          <span class="label">Remembers the last</span>
          <div class="seg" id="memory" role="group" aria-label="Remembers the last">
            <button data-n="1">1 word</button><button data-n="2">2 words</button
            ><button data-n="3">3 words</button>
          </div>
        </div>
        <div class="control speed">
          <label for="speed">Speed</label>
          <input type="range" id="speed" min="1" max="14" step="1" value="8" />
        </div>
        <div class="control seed">
          <label for="seed">Start with</label>
          <input
            type="text"
            id="seed"
            placeholder="e.g. the detective"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <div class="actions">
          <button id="clear" class="icon" title="Clear: start again" aria-label="Clear"></button>
          <button id="next" class="icon" title="Next word" aria-label="Next"></button>
          <button id="go" class="play" title="Start">Start</button>
        </div>
      </div>

      <div class="stage" id="stage">
        <div class="output" id="output" aria-live="polite"></div>
        <textarea id="pasteText" placeholder="Paste text here…" spellcheck="false"></textarea>
      </div>
      <div class="legend" id="legend">
        <span class="swatch">highlighted</span> = copied word for word from the book
      </div>
      <div class="status" id="status"></div>
    </section>

    <aside class="panel">
      <h2>Potential next words</h2>
      <div class="bars" id="bars"></div>
    </aside>
  </div>
</div>
