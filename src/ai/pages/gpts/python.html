<div class="ai ai-gpts ai-tools">
  <div class="app wide nopick">
    <section class="main">
      <div class="lead">
        <div class="prompt" id="prompt"></div>
        <div class="commands">
          <span class="mode" id="mode"></span>
          <div class="switch" id="switch" role="group" aria-label="Python tool">
            <button data-mode="plain">Code off</button>
            <button data-mode="tools">Code on</button>
          </div>
          <button id="go">Start</button>
        </div>
      </div>
      <div class="results" id="results"></div>
    </section>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="sheet wire">
      <div class="chrome"><span id="terminalTitle"></span><button id="closeModal">Close</button></div>
      <textarea id="code" spellcheck="false" readonly></textarea>
    </div>
  </div>
</div>
