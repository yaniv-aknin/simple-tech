<div class="ai ai-gpts" data-task="s-m-l">
  <div class="app wide nopick">
    <section class="main">
      <div class="lead">
        <div class="prompt" id="prompt"></div>
        <div class="commands">
          <span class="mode" id="mode"></span>
          <button id="go" class="play" title="Start">Start</button>
        </div>
      </div>
      <div class="results" id="results"></div>
    </section>
  </div>
  <div class="modal" id="modal" hidden>
    <div class="sheet">
      <div class="chrome"><span>message, exactly as sent</span><button id="closeModal">Close</button></div>
      <textarea id="code" spellcheck="false" autocomplete="off"></textarea>
    </div>
  </div>
</div>
