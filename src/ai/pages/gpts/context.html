<div class="ai ai-gpts ai-tools ai-context">
  <div class="app wide nopick">
    <section class="main ctx">
      <div class="prompt">
        <div class="q"><textarea id="question" rows="1" spellcheck="false"></textarea></div>
        <div class="sizes" id="presets"></div>
        <button id="reset">Reset</button>
      </div>
      <div class="cols">
        <div class="col" id="stuff">
          <div class="chead">
            <span class="mname">Context stuffing</span><span class="msub">load it all</span
            ><button class="run play" title="Run" data-method="stuff">Run</button>
          </div>
          <div class="switch scope" id="scope">
            <button data-scope="book" class="on" id="scopeBook"></button>
            <button data-scope="all" id="scopeAll">All 16 books</button>
          </div>
          <div class="meter">
            <div class="track">
              <div class="window" id="window"></div>
              <div class="fill" id="fill"></div>
            </div>
            <div class="legend"><span id="meterTokens"></span><span id="meterLimit"></span></div>
          </div>
          <div class="body" id="stuffBody"></div>
          <div class="metrics" id="stuffMetrics"></div>
        </div>
        <div class="col" id="rag">
          <div class="chead">
            <span class="mname">RAG</span><span class="msub">find the passages</span
            ><button class="run play" title="Run" data-method="rag">Run</button>
          </div>
          <div class="body" id="ragBody"></div>
          <div class="metrics" id="ragMetrics"></div>
        </div>
        <div class="col" id="agents">
          <div class="chead">
            <span class="mname">Sub-agents</span><span class="msub">one per book</span>
            <div class="runbox">
              <button class="run play" title="Run" data-method="agents">Run</button
              ><small id="agentsSpeed"></small>
            </div>
          </div>
          <div class="scroll" id="agentsScroll">
            <div class="tiles" id="tiles"></div>
            <div class="body" id="agentsBody"></div>
          </div>
          <div class="metrics" id="agentsMetrics"></div>
        </div>
      </div>
    </section>
  </div>
</div>
