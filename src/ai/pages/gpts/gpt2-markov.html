<div class="ai ai-gpts multiline" data-task="gpt2-markov">
  <div class="app wide">
    <header class="bar">
      <h1>GPT2 vs Markov</h1>
      <span class="mode" id="mode"></span>
      <button id="go">Start</button>
    </header>
    <nav class="books" id="books" aria-label="Choose a prompt"></nav>
    <section class="main">
      <div class="prompt" id="prompt"></div>
      <div class="results" id="results"></div>
    </section>
  </div>
  <div class="modal" id="scriptModal" hidden>
    <div class="sheet paper">
      <div class="chrome">
        <button id="editScript">Edit text</button><button id="closeScript">Close</button>
      </div>
      <pre class="script" id="scriptView"></pre>
      <textarea class="script" id="scriptCode" spellcheck="false" hidden></textarea>
    </div>
  </div>
</div>
