<div class="ai ai-gpts multiline" data-task="gpt2-markov">
  <div class="app wide">
    <section class="main">
      <div class="promptbox">
        <div class="phead">
          <span class="label">Prompt</span>
          <nav class="seg" id="books" aria-label="Choose a prompt"></nav>
          <span class="mode" id="mode"></span>
          <button id="go" class="play" title="Start">Start</button>
        </div>
        <div class="prompt" id="prompt"></div>
      </div>
      <div class="results" id="results"></div>
    </section>
  </div>
  <div class="modal" id="scriptModal" hidden>
    <div class="sheet paper">
      <div class="chrome">
        <button id="editScript">Edit text</button><button id="closeScript">Close</button>
      </div>
      <pre class="script" id="scriptView"></pre>
      <textarea class="script" id="scriptCode" spellcheck="false" hidden></textarea>
    </div>
  </div>
</div>
