<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hey do you have a pen?</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/gpts/gpts.css">
<link rel="stylesheet" href="/gpts/tools.css">
</head>
<body>
<div class="app wide nopick">
  <header class="bar">
    <h1>Hey do you have a pen?</h1>
    <div class="switch" id="switch" role="group" aria-label="Python tool">
      <button data-mode="plain">Code off</button>
      <button data-mode="tools">Code on</button>
    </div>
    <button id="go">Start</button>
  </header>
  <section class="main">
    <div class="prompt" id="prompt"></div>
    <div class="results" id="results"></div>
  </section>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet wire">
    <div class="chrome"><span id="terminalTitle"></span><button id="closeModal">Close</button></div>
    <textarea id="code" spellcheck="false" readonly></textarea>
  </div>
</div>

<script src="/common.js"></script>
<script src="/gpts/tools.js"></script>
<script src="/deck-keys.js"></script>
</body>
</html>
